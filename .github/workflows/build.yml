name: Build JBC

on:
  push:
    branches:
      - main
      - develop-main
    tags:
      - "v*"

  pull_request:
    branches:
      - main
      - develop-main

  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64

    runs-on: windows-2022
    permissions:
      contents: read

    steps:

      # ----------------------------------------
      # Checkout
      # ----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false


      # ----------------------------------------
      # Install Qt
      # ----------------------------------------
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.0"
          host: windows
          target: desktop
          arch: win64_msvc2022_64

          modules: >
            qtmultimedia
            qtshadertools

          cache: true


      # ----------------------------------------
      # Setup MSVC
      # ----------------------------------------
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1


      # ----------------------------------------
      # Configure
      # ----------------------------------------
      - name: Configure CMake
        shell: pwsh
        run: |
          cmake `
            -S . `
            -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"


      # ----------------------------------------
      # Build
      # ----------------------------------------
      - name: Build application
        shell: pwsh
        run: |
          cmake `
            --build build `
            --config Release `
            --parallel


      # ----------------------------------------
      # Check executable
      # ----------------------------------------
      - name: Check executable
        shell: pwsh
        run: |
          if (!(Test-Path "build\Release\JarredsBeatComposer.exe")) {
              Write-Error "JarredsBeatComposer.exe was not found!"
              exit 1
          }

          Write-Host "Found JarredsBeatComposer.exe"


      # ----------------------------------------
      # Deploy Qt
      # ----------------------------------------
      - name: Deploy Qt
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path package

          windeployqt `
            --release `
            --dir package `
            "build\Release\JarredsBeatComposer.exe"


      # ----------------------------------------
      # Copy executable
      # ----------------------------------------
      - name: Copy application
        shell: pwsh
        run: |
          Copy-Item `
            "build\Release\JarredsBeatComposer.exe" `
            "package\JarredsBeatComposer.exe"

      # - name: Add release documentation
      #   shell: pwsh
      #   run: |
      #     Copy-Item README.md package\README.md
      #     Copy-Item LICENSE package\LICENSE

      - name: Create release archive
        shell: pwsh
        run: |
          Compress-Archive `
            -Path package\* `
            -DestinationPath JarredsBeatComposer-Windows-x64.zip `
            -Force

      # ----------------------------------------
      # Upload artifact
      # ----------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JarredsBeatComposer-Windows-x64
          path: JarredsBeatComposer-Windows-x64.zip

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: JarredsBeatComposer-Windows-x64
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/JarredsBeatComposer-Windows-x64.zip